name: CarePath CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carepath_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply PostgreSQL Schema
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d carepath_ci -f backend/sql/schema.sql

      - name: Run Backend Test Suite (Live Postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/carepath_ci
          JWT_SECRET: ci_test_secret_32_characters_long_val!
          DEMO_MODE: "true"
        run: npm test

      - name: Install root dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Build Production Docker Image
        run: |
          docker build -t carepath-backend:ci ./backend
